<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株式会社アクティブモア手順書作成アプリ</title>
<style>
  :root{
    --navy:#1b3a5c;
    --navy-light:#2c5282;
    --accent:#2b6cb0;
    --bg:#f4f6f8;
    --card:#ffffff;
    --border:#d9dee3;
    --text:#222;
    --muted:#666;
    --danger:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--text); font-size:15px;
  }
  header.appbar{
    background:var(--navy); color:#fff; padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  header.appbar h1{font-size:18px; margin:0; font-weight:600;}
  header.appbar .sub{font-size:12px; opacity:.8;}
  main{max-width:960px; margin:0 auto; padding:24px 16px 80px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:16px;}
  h2.section-title{font-size:16px; color:var(--navy); border-left:4px solid var(--accent); padding-left:10px; margin:0 0 16px;}
  label.field-label{display:block; font-size:13px; color:var(--muted); margin-bottom:4px; font-weight:600;}
  input[type=text], input[type=number], textarea, select{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px;
    font-size:14px; font-family:inherit; background:#fff;
  }
  textarea{resize:vertical; min-height:70px;}
  .field{margin-bottom:14px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  button{
    cursor:pointer; border:none; border-radius:6px; padding:10px 18px;
    font-size:14px; font-weight:600; font-family:inherit;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--navy-light);}
  .btn-secondary{background:#e9edf1; color:var(--text);}
  .btn-secondary:hover{background:#dfe4e9;}
  .btn-danger{background:#fdecea; color:var(--danger);}
  .btn-danger:hover{background:#f8d7d2;}
  .btn-ghost{background:transparent; color:var(--accent); padding:6px 8px;}
  .toolbar{display:flex; gap:10px; margin:20px 0; flex-wrap:wrap;}
  .step-row{
    display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--border);
    border-radius:8px; margin-bottom:10px; background:#fbfcfd;
  }
  .step-row .num{
    width:30px; height:30px; border-radius:50%; background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0;
  }
  .step-row .info{flex:1;}
  .step-row .info .name{font-weight:600;}
  .step-row .info .meta{font-size:12px; color:var(--muted);}
  .step-row .actions{display:flex; gap:6px;}
  .manual-item{
    display:flex; justify-content:space-between; align-items:center; padding:14px;
    border:1px solid var(--border); border-radius:8px; margin-bottom:10px; background:#fff;
  }
  .manual-item .title{font-weight:700; color:var(--navy);}
  .manual-item .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .empty{color:var(--muted); text-align:center; padding:40px 0;}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-start;
    justify-content:center; overflow:auto; z-index:50; padding:30px 12px;
  }
  .modal{background:#fff; border-radius:10px; width:100%; max-width:640px; padding:24px;}
  .modal h3{margin-top:0; color:var(--navy);}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
  .badge{display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:#e3edf7; color:var(--navy); font-weight:700;}
  .branch-box{border:1px dashed var(--accent); border-radius:8px; padding:12px; margin-top:10px; background:#f3f8fd;}
  .image-drop{
    border:2px dashed var(--border); border-radius:8px; padding:14px; text-align:center; color:var(--muted);
    cursor:pointer; font-size:13px;
  }
  .image-preview{max-width:100%; max-height:160px; display:block; margin:0 auto 8px;}
  .tabs{display:flex; gap:0; border-bottom:2px solid var(--border); margin-bottom:20px;}
  .tabs button{
    background:none; border-radius:0; color:var(--muted); padding:10px 18px; border-bottom:3px solid transparent;
  }
  .tabs button.active{color:var(--navy); border-bottom-color:var(--accent);}

  /* ---------- Preview / print layout ---------- */
  .sheet{background:#fff; border:1px solid var(--border); padding:28px; margin-bottom:20px;}
  .sheet h1.doc-title{
    font-size:22px; color:#fff; background:var(--navy); padding:12px 18px; margin:0 0 18px; border-radius:4px;
  }
  table.meta-table{width:100%; border-collapse:collapse; margin-bottom:24px; font-size:13px;}
  table.meta-table th, table.meta-table td{border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top;}
  table.meta-table th{background:#eef3f8; color:var(--navy); width:120px; font-weight:700;}
  .flow-wrap{margin-bottom:28px; overflow-x:auto;}
  .flow-wrap h3, .steps-wrap h3{font-size:14px; color:var(--navy); margin:0 0 10px;}
  .step-block{
    display:flex; gap:16px; border:1px solid var(--border); border-radius:8px; margin-bottom:14px; overflow:hidden;
    page-break-inside:avoid;
  }
  .step-block .side{
    width:56px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; flex-shrink:0;
  }
  .step-block .body{flex:1; padding:14px 16px;}
  .step-block .body .top-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .step-block .body .top-row .name{font-weight:700; font-size:15px;}
  .step-block .body .top-row .time{font-size:12px; color:var(--muted);}
  .step-block .body ul{margin:0; padding-left:20px;}
  .step-block .body ul li{margin-bottom:4px; font-size:13px;}
  .step-block .imgcell{width:150px; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:10px; background:#fafafa; border-left:1px solid var(--border);}
  .step-block .imgcell img{max-width:100%; max-height:120px;}
  .step-block .imgcell .noimg{font-size:11px; color:#aaa; text-align:center;}
  .print-actions{display:flex; gap:10px; margin-bottom:16px;}
  .doc-footer{margin-top:16px; padding-top:8px; border-top:1px solid var(--border); font-size:11px; color:var(--muted);}
  .doc-footer-sep{margin:0 8px;}
  .memo-box{
    margin-top:20px; border:1px dashed var(--border); border-radius:8px; padding:12px 14px; min-height:160px;
  }
  .memo-box .memo-label{font-size:12px; font-weight:700; color:var(--muted); margin-bottom:8px;}
  .precautions-box{
    margin-top:20px; border:1px solid #f0c36d; background:#fffaf0; border-radius:8px; padding:12px 14px;
  }
  .precautions-box .precautions-label{font-size:13px; font-weight:700; color:#8a5a00; margin-bottom:6px;}
  .precautions-box .precautions-text{font-size:13px; color:#333; line-height:1.6; white-space:pre-wrap;}
  .page-break{ break-before:page; page-break-before:always; }
  .app-toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px);
    background:#1b3a5c; color:#fff; padding:12px 20px; border-radius:8px; font-size:13px;
    box-shadow:0 4px 16px rgba(0,0,0,.2); z-index:200; opacity:0; transition:opacity .25s, transform .25s;
    max-width:80vw; text-align:center;
  }
  .app-toast.show{ opacity:1; transform:translate(-50%,0); }
  .app-toast.app-toast-error{ background:#c0392b; }
  @media (max-width:640px){
    main{padding:16px 10px 60px;}
    .sheet{padding:16px 12px;}
    .grid2, .grid3{grid-template-columns:1fr;}
    table.meta-table, table.meta-table tbody, table.meta-table tr, table.meta-table th, table.meta-table td{
      display:block; width:auto !important;
    }
    table.meta-table tr{margin-bottom:2px;}
    table.meta-table th{border-bottom:none; padding-bottom:4px;}
    table.meta-table td{border-top:none; padding-top:4px; padding-bottom:12px;}
    .step-block{flex-direction:column;}
    .step-block .side{width:100%; height:34px;}
    .step-block .imgcell{width:auto; border-left:none; border-top:1px solid var(--border);}
    .tabs button{padding:10px 10px; font-size:13px;}
    header.appbar h1{font-size:15px;}
    header.appbar .sub{font-size:11px;}
  }
  @media print{
    header.appbar, .toolbar, .print-actions, .tabs{display:none !important;}
    body{background:#fff;}
    main{max-width:none; padding:0; margin:0;}
    .sheet{border:none; padding:0;}
  }
</style>
</head>
<body>
<header class="appbar">
  <div style="display:flex; align-items:center; gap:12px;">
    <img src="logo.png" alt="ロゴ" style="height:40px; width:40px; object-fit:contain; background:#fff; border-radius:8px; padding:2px;">
    <div>
      <h1 id="appTitle">株式会社アクティブモア手順書作成アプリ</h1>
      <div class="sub" id="appSub">アクティブモア 手順書統一フォーマット</div>
    </div>
  </div>
  <div id="headerActions"></div>
</header>
<main id="app"></main>

<script>
/* ---------------- storage ---------------- */
const STORAGE_KEY = 'care_manuals_v1';

function loadManuals(){
  let list;
  try{ list = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch(e){ return []; }
  list.forEach(normalizeManual);
  return list;
}
// migrate old single "purpose" field into split purposeUser/purposeStaff, and fill any missing basic fields
function normalizeManual(m){
  const b = m.basic || (m.basic = {});
  if(b.purposeUser === undefined) b.purposeUser = b.purpose || '';
  if(b.purposeStaff === undefined) b.purposeStaff = '';
  if(b.facility === undefined) b.facility = '';
  if(b.category === undefined) b.category = '';
  if(b.precautions === undefined) b.precautions = '';
  delete b.purpose;
  if(m.revisions === undefined) m.revisions = [];
  return m;
}
function fmtDate(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}
function saveManuals(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
function uid(){ return 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

const FACILITIES = [
  '愛ほっと訪問看護ステーション（宇和島）',
  '愛ほっと訪問看護ステーション（愛なん）',
  '愛ほっとリハビリステーションうわじま',
  '愛ほっとデイサービスきほく',
  'サービス付き高齢者向け住宅愛ほっと',
  '愛ほっと療育ステーション'
];

function newManual(){
  return {
    id: uid(),
    createdAt: Date.now(),
    updatedAt: Date.now(),
    basic: {
      facility:'', category:'', title:'', jobRole:'', purposeUser:'', purposeStaff:'', target:'', deadline:'', completionState:'', totalTime:'', precautions:''
    },
    steps: [],
    revisions: []
  };
}
function newStep(){
  return {
    itemName:'', timeEstimate:'', procedureLines:[''], image:null,
    branch:{ enabled:false, question:'', yesTarget:'next', noTarget:'self' }
  };
}

/* ---------------- state ---------------- */
let state = {
  screen: 'list',      // list | basic | steps | preview
  manualId: null,
  editingStepIndex: null,
  tempStep: null
};

function currentManual(){
  const list = loadManuals();
  return list.find(m => m.id === state.manualId) || null;
}
function updateManual(mutator){
  const list = loadManuals();
  const idx = list.findIndex(m => m.id === state.manualId);
  if(idx === -1) return;
  mutator(list[idx]);
  list[idx].updatedAt = Date.now();
  saveManuals(list);
  render();
}

/* ---------------- render dispatch ---------------- */
function render(){
  const app = document.getElementById('app');
  const headerActions = document.getElementById('headerActions');
  headerActions.innerHTML = '';
  if(state.screen === 'list'){
    document.getElementById('appSub').textContent = 'アクティブモア 手順書統一フォーマット';
    app.innerHTML = renderList();
    attachListHandlers();
  } else {
    const m = currentManual();
    if(!m){ state.screen='list'; return render(); }
    document.getElementById('appSub').textContent = (m.basic.title || '(タイトル未入力)');
    const backBtn = document.createElement('button');
    backBtn.className='btn-secondary'; backBtn.textContent='一覧へ戻る';
    backBtn.onclick = ()=>{ state.screen='list'; state.manualId=null; render(); };
    headerActions.appendChild(backBtn);

    let tabsHtml = renderTabs();
    if(state.screen === 'basic'){
      app.innerHTML = tabsHtml + renderBasic(m);
      attachBasicHandlers();
    } else if(state.screen === 'steps'){
      app.innerHTML = tabsHtml + renderSteps(m);
      attachStepsHandlers();
    } else if(state.screen === 'preview'){
      app.innerHTML = tabsHtml + renderPreview(m);
      attachPreviewHandlers();
    }
  }
}

function renderTabs(){
  const tabs = [
    {id:'basic', label:'① 基本情報'},
    {id:'steps', label:'② 手順を入力'},
    {id:'preview', label:'③ 手順書プレビュー・印刷'}
  ];
  return '<div class="tabs">' + tabs.map(t =>
    `<button data-tab="${t.id}" class="${state.screen===t.id?'active':''}">${t.label}</button>`
  ).join('') + '</div>';
}

/* ---------------- LIST screen ---------------- */
function renderList(){
  const list = loadManuals().sort((a,b)=>b.updatedAt-a.updatedAt);
  let html = '<div class="toolbar"><button class="btn-primary" id="btnNewManual">＋ 新しい手順書を作成</button></div>';
  if(list.length === 0){
    html += '<div class="card"><div class="empty">まだ手順書がありません。「＋ 新しい手順書を作成」から始めてください。</div></div>';
  } else {
    html += '<div class="card">';
    list.forEach(m=>{
      const d = new Date(m.updatedAt);
      const dstr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      html += `<div class="manual-item">
        <div>
          <div class="title">${m.basic.category?'<span class="badge">'+escapeHtml(m.basic.category)+'</span> ':''}${escapeHtml(m.basic.title || '(タイトル未入力)')}</div>
          <div class="sub">${escapeHtml(m.basic.facility||'(事業所未選択)')} ／ ${escapeHtml(m.basic.jobRole||'')} ／ 手順数:${m.steps.length} ／ 更新:${dstr}</div>
        </div>
        <div class="actions" style="display:flex;gap:8px;">
          <button class="btn-secondary" data-open="${m.id}">開く</button>
          <button class="btn-ghost" data-dup="${m.id}">複製</button>
          <button class="btn-danger" data-del="${m.id}">削除</button>
        </div>
      </div>`;
    });
    html += '</div>';
  }
  html += `<div class="card">
    <h2 class="section-title">バックアップ・共有</h2>
    <p style="font-size:13px;color:var(--muted);">この端末のブラウザに保存されています。他の人と共有したり、別の端末で続きを編集する場合はJSONファイルで書き出し・読み込みができます。</p>
    <div class="toolbar" style="margin:0;">
      <button class="btn-secondary" id="btnExportAll">全データをJSON書き出し</button>
      <button class="btn-secondary" id="btnImportTrigger">JSON読み込み</button>
      <input type="file" id="importFile" accept="application/json" style="position:absolute; width:1px; height:1px; opacity:0; overflow:hidden;">
    </div>
  </div>`;
  return html;
}
function attachListHandlers(){
  const btnNew = document.getElementById('btnNewManual');
  if(btnNew) btnNew.onclick = ()=>{
    const list = loadManuals();
    const m = newManual();
    list.push(m);
    saveManuals(list);
    state.manualId = m.id;
    state.screen = 'basic';
    render();
  };
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>{ state.manualId = el.getAttribute('data-open'); state.screen='basic'; render(); };
  });
  document.querySelectorAll('[data-dup]').forEach(el=>{
    el.onclick = ()=>{
      const list = loadManuals();
      const src = list.find(m=>m.id===el.getAttribute('data-dup'));
      if(!src) return;
      const copy = JSON.parse(JSON.stringify(src));
      copy.id = uid(); copy.createdAt=Date.now(); copy.updatedAt=Date.now();
      copy.basic.title = (copy.basic.title||'') + '（コピー）';
      list.push(copy); saveManuals(list); render();
    };
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=>{
      appConfirm('この手順書を削除しますか？元に戻せません。', ()=>{
        let list = loadManuals();
        list = list.filter(m=>m.id!==el.getAttribute('data-del'));
        saveManuals(list); render();
      });
    };
  });
  const btnExport = document.getElementById('btnExportAll');
  if(btnExport) btnExport.onclick = ()=>{
    const data = JSON.stringify(loadManuals(), null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'manuals_backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };
  const importFile = document.getElementById('importFile');
  const btnImportTrigger = document.getElementById('btnImportTrigger');
  if(btnImportTrigger && importFile) btnImportTrigger.onclick = ()=> importFile.click();
  if(importFile) importFile.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const incoming = JSON.parse(reader.result);
        if(!Array.isArray(incoming)) throw new Error('形式が違います');
        const existing = loadManuals();
        const merged = existing.concat(incoming.filter(im=>!existing.some(ex=>ex.id===im.id)));
        saveManuals(merged);
        render();
        appToast('読み込みました。');
      }catch(err){ appToast('読み込みに失敗しました: '+err.message, {error:true, duration:5000}); }
    };
    reader.readAsText(file);
  };
}

/* ---------------- BASIC screen ---------------- */
function renderBasic(m){
  const b = m.basic;
  return `<div class="card">
    <h2 class="section-title">基本情報を入力する</h2>
    <div class="field">
      <label class="field-label">事業所</label>
      <select id="f_facility">
        <option value="">選択してください</option>
        ${FACILITIES.map(f=>`<option value="${attr(f)}" ${b.facility===f?'selected':''}>${escapeHtml(f)}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label class="field-label">カテゴリー</label>
      <select id="f_category">
        <option value="">選択してください</option>
        <option value="直接介助" ${b.category==='直接介助'?'selected':''}>直接介助</option>
        <option value="間接介助" ${b.category==='間接介助'?'selected':''}>間接介助</option>
      </select>
    </div>
    <div class="field">
      <label class="field-label">タイトル（手順書名）</label>
      <input type="text" id="f_title" value="${attr(b.title)}" placeholder="例）居室環境整備の手順（サ高住・間接介助）">
    </div>
    <div class="grid2">
      <div class="field">
        <label class="field-label">対象職種</label>
        <input type="text" id="f_jobRole" value="${attr(b.jobRole)}" placeholder="例）生活相談員、介護職員">
      </div>
      <div class="field">
        <label class="field-label">対象者・対象範囲</label>
        <input type="text" id="f_target" value="${attr(b.target)}" placeholder="例）サ高住 全入居者">
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label class="field-label">目的（利用者視点）</label>
        <textarea id="f_purposeUser" placeholder="例）快適で清潔な居室で安心して過ごせる">${escapeHtml(b.purposeUser)}</textarea>
      </div>
      <div class="field">
        <label class="field-label">目的（スタッフ視点）</label>
        <textarea id="f_purposeStaff" placeholder="例）誰が担当しても同じ品質で環境整備ができる">${escapeHtml(b.purposeStaff)}</textarea>
      </div>
    </div>
    <div class="grid3">
      <div class="field">
        <label class="field-label">完了期限</label>
        <input type="text" id="f_deadline" value="${attr(b.deadline)}" placeholder="例）15分以内に終わる">
      </div>
      <div class="field">
        <label class="field-label">完了時の状態（ゴール）</label>
        <input type="text" id="f_completionState" value="${attr(b.completionState)}" placeholder="例）ゴミがなくなり、清潔で換気された居室になっている">
      </div>
      <div class="field">
        <label class="field-label">全体の所要時間目安</label>
        <input type="text" id="f_totalTime" value="${attr(b.totalTime)}" placeholder="例）20分">
      </div>
    </div>
    <div class="field">
      <label class="field-label">注意事項・心得</label>
      <textarea id="f_precautions" placeholder="例）利用者様の私物には手を触れない。体調がすぐれない様子の時は先に声をかけ、無理に作業を進めない。">${escapeHtml(b.precautions)}</textarea>
    </div>
    <div class="toolbar">
      <button class="btn-primary" id="btnToSteps">次へ（手順を入力する）</button>
    </div>
  </div>`;
}
function attachBasicHandlers(){
  ['title','jobRole','target','purposeUser','purposeStaff','deadline','completionState','totalTime','precautions'].forEach(key=>{
    const el = document.getElementById('f_'+key);
    if(!el) return;
    el.oninput = ()=>{

// silent update: mutate localStorage without full re-render (keeps input focus)
function updateManualSilent(mutator){
  const list = loadManuals();
  const idx = list.findIndex(m => m.id === state.manualId);
  if(idx === -1) return;
  mutator(list[idx]);
  list[idx].updatedAt = Date.now();
  saveManuals(list);
}

function stepTargetLabel(m, target){
  if(target === 'next') return '次の手順へ進む';
  if(target === 'end') return '終了';
  if(target === 'self') return 'この手順をやり直す';
  const idx = parseInt(String(target).replace('step:',''),10);
  if(!isNaN(idx) && m.steps[idx]) return `手順${idx+1}「${m.steps[idx].itemName||'(未入力)'}」へ`;
  return target;

/* ---------------- flowchart SVG ---------------- */
function renderFlowchartSVG(m){
  const steps = m.steps;
  if(steps.length===0) return '<div class="empty">手順が入力されていないため、フローチャートは表示されません。</div>';

  const RECT_H = 50, RECT_MIN_W = 260, RECT_MAX_W = 520;
  const DIA_H = 76, DIA_MIN_W = 260, DIA_MAX_W = 460;
  const GAP = 28;
  const START_H = 40, END_H = 40, TERMINAL_W = 140;
  const CHAR_PX = 15.5, PAD_PX = 56; // rough per-character width budget used to size boxes to their text

  // a box/diamond grows to fit its label (up to a max), so longer text doesn't get clipped
  function fitWidth(label, minW, maxW){
    const len = [...String(label)].length;
    return Math.max(minW, Math.min(maxW, Math.round(len*CHAR_PX + PAD_PX)));
  }
  // hard safety cap on characters shown, sized to whatever the box's max width can actually fit
  function maxCharsFor(maxW){ return Math.max(4, Math.floor((maxW-PAD_PX)/CHAR_PX)); }

  // build node list: start, then per step [rect, (diamond)], then end
  let nodes = [];
  nodes.push({type:'terminal', id:'start', label:'開始', w:TERMINAL_W});
  steps.forEach((s,i)=>{
    const rectLabel = `${i+1}. ${s.itemName||'(未入力)'}`;
    nodes.push({type:'rect', id:'step:'+i, label:rectLabel, stepIndex:i, w:fitWidth(rectLabel,RECT_MIN_W,RECT_MAX_W)});
    if(s.branch.enabled){
      const diaLabel = s.branch.question||'判定';
      nodes.push({type:'diamond', id:'branch:'+i, label:diaLabel, stepIndex:i, w:fitWidth(diaLabel,DIA_MIN_W,DIA_MAX_W)});
    }
  });
  nodes.push({type:'terminal', id:'end', label:'終了', w:TERMINAL_W});

  // center chain based on the widest node plus room on both sides for YES/NO side-routing lanes
  const maxHalfW = Math.max(...nodes.map(n=>n.w/2));
  const laneBase = maxHalfW + 40;
  const CX = laneBase + 120; // leaves room for at least ~2 side lanes before the left edge

  // compute y positions
  let y = 30;
  const pos = {};
  nodes.forEach(n=>{
    const h = n.type==='rect'?RECT_H : n.type==='diamond'?DIA_H : START_H;
    pos[n.id] = { cy: y + h/2, h, hw: n.w/2 };
    y += h + GAP;
  });
  const totalHeight = y + 10;
  const totalWidth = CX + laneBase + 120;

  // resolve a branch target ('next'|'end'|'self'|'step:i') to a node id in `nodes`
  function resolveTarget(fromStepIndex, target){
    if(target === 'end') return 'end';
    if(target === 'self') return 'branch:'+fromStepIndex;
    if(target === 'next'){
      const nextIdx = fromStepIndex+1;
      return nextIdx < steps.length ? 'step:'+nextIdx : 'end';
    }
    const m2 = String(target).match(/^step:(\d+)$/);
    if(m2) return 'step:'+m2[1];
    return 'end';
  }

  let svgParts = [];
  function esc(t){ return escapeHtml(t); }

  // draw nodes (each sized to its own text via pos[n.id].hw, computed above)
  nodes.forEach(n=>{
    const cy = pos[n.id].cy;
    const hw = pos[n.id].hw;
    if(n.type==='terminal'){
      svgParts.push(`<rect x="${CX-hw}" y="${cy-START_H/2}" width="${hw*2}" height="${START_H}" rx="20" fill="${n.id==='start'?'#2b6cb0':'#555'}" />`);
      svgParts.push(`<text x="${CX}" y="${cy+5}" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">${esc(n.label)}</text>`);
    } else if(n.type==='rect'){
      svgParts.push(`<rect x="${CX-hw}" y="${cy-RECT_H/2}" width="${hw*2}" height="${RECT_H}" rx="6" fill="#fff" stroke="#1b3a5c" stroke-width="1.5"/>`);
      svgParts.push(`<text x="${CX}" y="${cy+5}" text-anchor="middle" fill="#1b3a5c" font-size="14" font-weight="600">${esc(truncate(n.label,maxCharsFor(RECT_MAX_W)))}</text>`);
    } else if(n.type==='diamond'){
      const hh=DIA_H/2;
      svgParts.push(`<polygon points="${CX},${cy-hh} ${CX+hw},${cy} ${CX},${cy+hh} ${CX-hw},${cy}" fill="#fff8e6" stroke="#b7791f" stroke-width="1.5"/>`);
      svgParts.push(`<text x="${CX}" y="${cy+5}" text-anchor="middle" fill="#7c5a10" font-size="13" font-weight="600">${esc(truncate(n.label,maxCharsFor(DIA_MAX_W)))}</text>`);
    }
  });

  // straight default chain arrows (start->first, rect->diamond same step, and non-branch rect->next)
  for(let i=0;i<nodes.length-1;i++){
    const a = nodes[i], b = nodes[i+1];
    if(a.type==='diamond'){
      // only draw the straight default arrow when this diamond's YES path actually continues to the natural next node;
      // otherwise the explicit YES/NO edge-drawing below handles it (and would otherwise leave YES undrawn).
      const step = steps[a.stepIndex];
      const yesId = resolveTarget(a.stepIndex, step.branch.yesTarget);
      if(yesId !== b.id) continue;
      const y1b = pos[a.id].cy + pos[a.id].h/2;
      const y2b = pos[b.id].cy - pos[b.id].h/2;
      svgParts.push(arrowV(CX, y1b, CX, y2b));
      svgParts.push(`<text x="${CX+8}" y="${(y1b+y2b)/2}" font-size="11" font-weight="700" fill="#2b6cb0">YES</text>`);
      continue;
    }
    const y1 = pos[a.id].cy + pos[a.id].h/2;
    const y2 = pos[b.id].cy - pos[b.id].h/2;
    svgParts.push(arrowV(CX, y1, CX, y2));
  }

  // explicit YES/NO edges from diamonds
  const usedSides = {}; // track offset lanes to avoid overlap
  let laneRight = 0, laneLeft = 0;
  nodes.forEach(n=>{
    if(n.type!=='diamond') return;
    const si = n.stepIndex;
    const step = steps[si];
    const cy = pos[n.id].cy;
    ['yesTarget','noTarget'].forEach(key=>{
      const label = key==='yesTarget'?'YES':'NO';
      const targetVal = step.branch[key];
      const targetId = resolveTarget(si, targetVal);
      // if it's simply the natural next node in sequence AND it's YES, already drawn as straight chain -> skip
      const naturalNextId = nodes[nodes.indexOf(n)+1] ? nodes[nodes.indexOf(n)+1].id : null;
      if(label==='YES' && targetId === naturalNextId){
        return; // already drawn straight
      }
      const targetCy = pos[targetId] ? pos[targetId].cy : null;
      if(targetCy===null) return;
      const goingUp = targetCy < cy;
      const side = label==='YES' ? 1 : -1; // YES routes right, NO routes left
      const laneOffset = (side>0 ? (laneBase + laneRight*40) : (laneBase + laneLeft*40));
      if(side>0) laneRight++; else laneLeft++;
      const x1 = CX + side*pos[n.id].hw;
      const xMid = CX + side*laneOffset;
      const x3 = CX + side*pos[targetId].hw;
      svgParts.push(pathElbow(x1, cy, xMid, targetCy, x3, targetCy, label, side));
    });
  });

  function arrowV(x1,y1,x2,y2){
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2-6}" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>`;
  }
  function pathElbow(x1,y1,xMid,y2,x3,y3,label,side){
    // path: from (x1,y1) go horizontally to xMid, then vertically to y2, then horizontally to x3,y3 with arrowhead
    const d = `M ${x1} ${y1} L ${xMid} ${y1} L ${xMid} ${y2} L ${x3+ (side>0?6:-6)} ${y2}`;
    const labelX = xMid + (side>0?6:-6);
    const labelY = (y1+y2)/2;
    return `<path d="${d}" fill="none" stroke="${side>0?'#2b6cb0':'#c0392b'}" stroke-width="1.5" marker-end="url(${side>0?'#arrowBlue':'#arrowRed'})"/>` +
      `<text x="${labelX}" y="${labelY}" text-anchor="${side>0?'start':'end'}" font-size="11" font-weight="700" fill="${side>0?'#2b6cb0':'#c0392b'}">${label}</text>`;
  }

  const defs = `<defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#333"/></marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2b6cb0"/></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>`;

  return `<svg viewBox="0 0 ${totalWidth} ${totalHeight}" width="100%" style="max-width:${totalWidth}px; height:auto; display:block; margin:0 auto;">${defs}${svgParts.join('')}</svg>`;
}
function truncate(s,n){ s=String(s); return s.length>n ? s.slice(0,n-1)+'…' : s; }

/* ---------------- Word (.doc) export ---------------- */
// rasterize the on-screen flowchart SVG to a PNG data URI so Word (which has no real SVG support) can display it
function svgElementToPngDataUrl(svgEl, scale){
  return new Promise((resolve, reject)=>{
    const svgString = new XMLSerializer().serializeToString(svgEl);
    const viewBox = svgEl.getAttribute('viewBox');
    let w = 800, h = 600;
    if(viewBox){
      const parts = viewBox.split(' ').map(Number);
      w = parts[2]; h = parts[3];
    }
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(w*scale); canvas.height = Math.round(h*scale);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvas.width, canvas.height);
    const img = new Image();
    const svgBlob = new Blob([svgString], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    img.onload = ()=>{
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}
// Word has no real SVG support in <img>, so any svg data-uri step image must be rasterized to PNG first,
// otherwise Word's HTML importer can choke on it and produce huge blank areas / one-step-per-page pagination.
function imageToPngDataUrlIfSvg(dataUri, targetW, targetH){
  if(!dataUri || !dataUri.startsWith('data:image/svg+xml')) return Promise.resolve(dataUri);
  return new Promise((resolve)=>{
    const canvas = document.createElement('canvas');
    canvas.width = targetW; canvas.height = targetH;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvas.width, canvas.height);
    const img = new Image();
    img.onload = ()=>{
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = ()=> resolve(null); // fall back to "no image" rather than breaking the whole export
    img.src = dataUri;
  });
}
function buildWordHtml(m, flowImgTag){

      ? `<p style="color:#2b6cb0;font-size:11px;margin:6px 0 0;">分岐:「${escapeHtml(s.branch.question||'(条件未入力)')}」 → YES: ${escapeHtml(stepTargetLabel(m,s.branch.yesTarget))} ／ NO: ${escapeHtml(stepTargetLabel(m,s.branch.noTarget))}</p>`
      : '';
    // width/height set as real HTML attributes (not just CSS) — Word's HTML-to-doc filter often ignores
    // max-width/max-height in style and instead renders the image at its native pixel size otherwise.
    const imgCell = s.image ? `<img src="${s.image}" width="120" height="90" style="width:120px;height:90px;">` : '<span style="color:#999;font-size:11px;">画像なし</span>';
    return `<table style="width:100%;border:1px solid #d9dee3;border-collapse:collapse;margin-bottom:14px;">
      <tr>
        <td style="width:40px;background:#1b3a5c;color:#ffffff;font-size:18px;font-weight:bold;text-align:center;vertical-align:middle;">${i+1}</td>
        <td style="padding:10px 14px;vertical-align:top;">
          <p style="margin:0 0 6px;font-weight:bold;font-size:13px;">${escapeHtml(s.itemName||'(未入力)')} ${s.timeEstimate?`<span style="font-weight:normal;font-size:11px;color:#666;">(目安 ${escapeHtml(s.timeEstimate)})</span>`:''}</p>
          <ul style="margin:0;padding-left:18px;font-size:12px;">${bullets}</ul>
          ${branchHtml}
        </td>
        <td style="width:150px;text-align:center;vertical-align:middle;background:#fafafa;border-left:1px solid #d9dee3;">${imgCell}</td>
      </tr>
    </table>`;
  }).join('');
  const revs = (m.revisions||[]).slice().sort((a,b)=>a.date-b.date);
  const revText = revs.length ? ' ｜ 改訂履歴: ' + revs.map(r=>`${fmtDate(r.date)}${r.note?'（'+escapeHtml(r.note)+'）':''}`).join('、') : '';
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<title>${escapeHtml(m.basic.title||'手順書')}</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->
</head>
<body style="font-family:'游ゴシック','Yu Gothic','メイリオ',sans-serif;font-size:13px;color:#222;">
  <h1 style="background:#1b3a5c;color:#ffffff;padding:10px 14px;font-size:20px;margin:0 0 16px;">${m.basic.category?'【'+escapeHtml(m.basic.category)+'】':''}${escapeHtml(m.basic.title||'(タイトル未入力)')}</h1>
  <table style="width:100%;border-collapse:collapse;margin-bottom:16px;">
    <tr><th style="background:#eef3f8;color:#1b3a5c;border:1px solid #d9dee3;padding:6px 10px;text-align:left;width:120px;font-size:12px;">事業所</th><td style="border:1px solid #d9dee3;padding:6px 10px;font-size:12px;" colspan="3">${escapeHtml(m.basic.facility)}</td></tr>
    <tr><th style="background:#eef3f8;color:#1b3a5c;border:1px solid #d9dee3;padding:6px 10px;text-align:left;width:120px;font-size:12px;">対象職種</th><td style="border:1px solid #d9dee3;padding:6px 10px;font-size:12px;">${escapeHtml(m.basic.jobRole)}</td><th style="background:#eef3f8;color:#1b3a5c;border:1px solid #d9dee3;padding:6px 10px;text-align:left;width:120px;font-size:12px;">対象者・範囲</th><td style="border:1px solid #d9dee3;padding:6px 10px;font-size:12px;">${escapeHtml(m.basic.target)}</td></tr>
    <tr><th style="background:#eef3f8;color:#1b3a5c;border:1px solid #d9dee3;padding:6px 10px;text-align:left;width:120px;font-size:12px;">目的（利用者視点）</th><td style="border:1px solid #d9dee3;padding:6px 10px;font-size:12px;" colspan="3">${escapeHtml(m.basic.purposeUser).replace(/\n/g,'<br>')}</td></tr>
    <tr><th style="background:#eef3f8;color:#1b3a5c;border:1px solid #d9dee3;padding:6px 10px;text-align:left;width:120px;font-size:12px;">目的（スタッフ視点）</th><td style="border:1px solid #d9dee3;padding:6px 10px;font-size:12px;" colspan="3">${escapeHtml(m.basic.purposeStaff).replace(/\n/g,'<br>')}</td></tr>
    <tr><th style="background:#eef3f8;color:#1b3a5c;border:1px solid #d9dee3;padding:6px 10px;text-align:left;width:120px;font-size:12px;">完了期限</th><td style="border:1px solid #d9dee3;padding:6px 10px;font-size:12px;">${escapeHtml(m.basic.deadline)}</td><th style="background:#eef3f8;color:#1b3a5c;border:1px solid #d9dee3;padding:6px 10px;text-align:left;width:120px;font-size:12px;">完了時の状態</th><td style="border:1px solid #d9dee3;padding:6px 10px;font-size:12px;">${escapeHtml(m.basic.completionState)}</td></tr>
    <tr><th style="background:#eef3f8;color:#1b3a5c;border:1px solid #d9dee3;padding:6px 10px;text-align:left;width:120px;font-size:12px;">所要時間目安</th><td style="border:1px solid #d9dee3;padding:6px 10px;font-size:12px;" colspan="3">${escapeHtml(m.basic.totalTime)}</td></tr>
  </table>
  ${m.basic.precautions && m.basic.precautions.trim() ? `<div style="border:1px solid #f0c36d;background:#fffaf0;padding:10px 14px;margin-bottom:16px;"><div style="color:#8a5a00;font-weight:bold;font-size:12px;margin-bottom:4px;">⚠ 注意事項・心得</div><div style="font-size:12px;">${escapeHtml(m.basic.precautions).replace(/\n/g,'<br>')}</div></div>` : ''}
  <div style="border:1px dashed #d9dee3;padding:10px 14px;margin-bottom:16px;min-height:70px;"><div style="color:#666;font-weight:bold;font-size:11px;margin-bottom:6px;">メモ・備考欄</div></div>
  <div style="font-size:10px;color:#666;border-top:1px solid #d9dee3;padding-top:6px;margin-bottom:16px;">作成日: ${fmtDate(m.createdAt)}${revText}</div>
  <div style="page-break-before:always;">
    <h3 style="color:#1b3a5c;font-size:13px;margin:0 0 8px;">ワークフロー</h3>
    <p style="text-align:center;margin:0;">${flowImgTag}</p>
  </div>
  <div style="page-break-before:always;">
    <h3 style="color:#1b3a5c;font-size:13px;margin:0 0 8px;">作業手順</h3>
    ${stepsHtml || '<p>手順が入力されていません。</p>'}
  </div>
</body>
</html>`;
}
async function exportWordDoc(m){
  if(!m) return;
  let flowImgTag = '<span style="color:#999;">(手順が入力されていないためワークフロー図はありません)</span>';
  const svgEl = document.querySelector('.flow-wrap svg');
  if(svgEl){
    try{
      const pngDataUrl = await svgElementToPngDataUrl(svgEl, 2);
      // size the image in physical units (cm) so it fills a normal A4 page on its own, without the user having to resize it
      const viewBox = (svgEl.getAttribute('viewBox')||'0 0 800 600').split(' ').map(Number);
      const aspect = viewBox[2] / viewBox[3];
      const MAX_W_CM = 16, MAX_H_CM = 23; // A4 portrait minus typical margins and heading space
      let wCm = MAX_W_CM, hCm = wCm / aspect;
      if(hCm > MAX_H_CM){ hCm = MAX_H_CM; wCm = hCm * aspect; }
      // width/height as real HTML attributes (in px, 96px = 1in = 2.54cm) — Word's HTML-to-doc filter
      // often ignores CSS width/height on <img> and falls back to the embedded bitmap's native pixel size.
      const CM_TO_PX = 96 / 2.54;
      const wPx = Math.round(wCm * CM_TO_PX), hPx = Math.round(hCm * CM_TO_PX);
      flowImgTag = `<img src="${pngDataUrl}" width="${wPx}" height="${hPx}" style="width:${wCm.toFixed(1)}cm;height:${hCm.toFixed(1)}cm;">`;
    }catch(e){
      flowImgTag = '<span style="color:#c0392b;">(ワークフロー図の変換に失敗しました)</span>';
    }
  }
  // rasterize any SVG step images (e.g. the icon placeholders) to PNG — Word cannot render svg data-uris
  const mForWord = JSON.parse(JSON.stringify(m));
  await Promise.all(mForWord.steps.map(async (s)=>{
    s.image = await imageToPngDataUrlIfSvg(s.image, 280, 210);
  }));
  const html = buildWordHtml(mForWord, flowImgTag);
  const blob = new Blob(['﻿', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeTitle = (m.basic.title || '手順書').replace(/[\\/:*?"<>|]/g,'_');
  a.href = url; a.download = safeTitle + '.doc';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 3000);
  appToast('Wordファイルを保存しました。');
}

/* ---------------- custom confirm dialog (works without native window.confirm) ---------------- */
function appConfirm(message, onYes){
  const root = document.createElement('div');
  root.className = 'modal-overlay';
  root.style.zIndex = '100';
  root.innerHTML = `<div class="modal" style="max-width:360px;">
    <p style="margin:0 0 20px; font-size:14px;">${escapeHtml(message)}</p>
    <div class="modal-actions">
      <button class="btn-secondary" id="appConfirmNo">キャンセル</button>
      <button class="btn-danger" id="appConfirmYes">削除する</button>
    </div>
  </div>`;
  document.body.appendChild(root);
  const cleanup = ()=> root.remove();
  root.querySelector('#appConfirmNo').onclick = cleanup;
  root.addEventListener('click', (e)=>{ if(e.target === root) cleanup(); });
  root.querySelector('#appConfirmYes').onclick = ()=>{ cleanup(); onYes(); };
}

function appPrompt(message, onSubmit){
  const root = document.createElement('div');
  root.className = 'modal-overlay';
  root.style.zIndex = '100';
  root.innerHTML = `<div class="modal" style="max-width:360px;">
    <p style="margin:0 0 10px; font-size:14px;">${escapeHtml(message)}</p>
    <input type="text" id="appPromptInput" placeholder="例）備品リストを更新" style="margin-bottom:16px;">
    <div class="modal-actions">
      <button class="btn-secondary" id="appPromptCancel">キャンセル</button>
      <button class="btn-primary" id="appPromptOk">記録する</button>
    </div>
  </div>`;
  document.body.appendChild(root);
  const cleanup = ()=> root.remove();
  const input = root.querySelector('#appPromptInput');
  root.querySelector('#appPromptCancel').onclick = cleanup;
  root.addEventListener('click', (e)=>{ if(e.target === root) cleanup(); });
  root.querySelector('#appPromptOk').onclick = ()=>{ const v = input.value; cleanup(); onSubmit(v); };
  setTimeout(()=>input.focus(), 0);
}

// non-blocking replacement for window.alert() — native alert() can hang the page in some browser/webview contexts
function appToast(message, opts){
  opts = opts || {};
  document.querySelectorAll('.app-toast').forEach(el=>el.remove());
  const el = document.createElement('div');
  el.className = 'app-toast' + (opts.error ? ' app-toast-error' : '');
  el.textContent = message;
  document.body.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 300);
  }, opts.duration || 3000);
}

/* ---------------- utils ---------------- */
function escapeHtml(str){
  return String(str==null?'':str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function attr(str){ return escapeHtml(str); }
